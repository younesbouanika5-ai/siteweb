```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pour ma femme ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    background: white;
    width: 90%;
    max-width: 500px;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    z-index: 2;
}

h1 {
    color: #ff4d6d;
    margin-bottom: 20px;
}

p {
    font-size: 20px;
    margin: 20px;
}

.photos {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
}

.photos img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #ff4d6d;
}


button {
    background: #ff4d6d;
    color: white;
    border: none;
    padding: 15px 40px;
    border-radius: 50px;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background:#ff1744;
}


.hidden {
    display:none;
}


/* Coeurs */

.heart {
    position:absolute;
    color:#ff1744;
    font-size:25px;
    animation: float 4s linear forwards;
}


@keyframes float {

0% {
    transform:translateY(0) scale(1);
    opacity:1;
}

100% {
    transform:translateY(-800px) scale(2);
    opacity:0;
}

}


</style>

</head>


<body>


<div class="container">


<div id="page1">

<h1>❤️ Mon amour ❤️</h1>


<div class="photos">

<img src="images/photo1.jpg">

<img src="images/photo2.jpg">

</div>


<p>
Est-ce que tu boudes ? 🥺
</p>


<button onclick="non()">
Non ❤️
</button>


</div>




<div id="page2" class="hidden">


<h1>🥰 Je savais ❤️</h1>


<p>
Merci mon amour ❤️
</p>


<p>
Est-ce que tu m'aimes ? 😘
</p>


<button onclick="oui()">
Oui ❤️
</button>


</div>




<div id="page3" class="hidden">


<h1>
Je t'aime aussi ❤️
</h1>


<p>
Tu es la plus belle chose qui me soit arrivée 💕
</p>


<div class="photos">

<img src="images/photo1.jpg">

<img src="images/photo2.jpg">

</div>


</div>


</div>





<script>


function createHeart(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";


heart.style.left=Math.random()*100+"vw";

heart.style.bottom="0px";

heart.style.fontSize=(20+Math.random()*40)+"px";


document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},4000);


}



function non(){


for(let i=0;i<50;i++){

setTimeout(createHeart,i*50);

}


setTimeout(()=>{


document.getElementById("page1").classList.add("hidden");

document.getElementById("page2").classList.remove("hidden");


},1500);



}




function oui(){


for(let i=0;i<100;i++){

setTimeout(createHeart,i*30);

}



document.getElementById("page2").classList.add("hidden");

document.getElementById("page3").classList.remove("hidden");

}


</script>



</body>
</html>
