<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Pour Mon Amour ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff4d6d,#ff9a9e);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    color:white;
}

.photos{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:25px;
}

.photos img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid white;
    box-shadow:0 0 20px rgba(255,255,255,.6);
}

.card{
    background:rgba(255,255,255,.15);
    padding:35px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}

h1{
    margin-bottom:20px;
}

button{
    padding:15px 40px;
    font-size:20px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:white;
    color:#ff2d55;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

#question2,#fin{
    display:none;
}

.heart{
    position:fixed;
    font-size:25px;
    animation:fall 4s linear forwards;
    pointer-events:none;
}

@keyframes fall{
    from{
        transform:translateY(-50px);
        opacity:1;
    }
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="photos">
<img src="photo1.jpg" alt="Nous">
<img src="photo2.jpg" alt="Nous">
</div>

<div class="card">

<div id="question1">
<h1>❤️ Est-ce que tu boudes ? ❤️</h1>

<button onclick="suite1()">Non ❤️</button>
</div>

<div id="question2">
<h1>🥰 Est-ce que tu m'aimes ? 🥰</h1>

<button onclick="suite2()">Oui, pour toujours ❤️</button>
</div>

<div id="fin">
<h1>💖 Je t'aime plus que tout mon cœur 💖</h1>

<h2>Merci d'être la plus belle chose de ma vie ❤️</h2>

<br>

<h1>😘 Je t'aimerai toujours 😘</h1>

</div>

</div>

</div>

<script>

function pluieCoeurs(){

for(let i=0;i<40;i++){

let coeur=document.createElement("div");

coeur.innerHTML="❤️";

coeur.className="heart";

coeur.style.left=Math.random()*100+"vw";

coeur.style.fontSize=(20+Math.random()*30)+"px";

coeur.style.animationDuration=(2+Math.random()*3)+"s";

document.body.appendChild(coeur);

setTimeout(()=>coeur.remove(),5000);

}

}

function suite1(){

pluieCoeurs();

document.getElementById("question1").style.display="none";

document.getElementById("question2").style.display="block";

}

function suite2(){

pluieCoeurs();

setInterval(pluieCoeurs,1500);

document.getElementById("question2").style.display="none";

document.getElementById("fin").style.display="block";

}

</script>

</body>
</html>
